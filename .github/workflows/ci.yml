name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the code claims to support; 3.12 is what it is
        # developed on. Breaking either is a bug worth failing the build for.
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install system libraries OpenCV links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed a demo shop
        run: python tools/seed.py --reset

      # The GUI tests skip themselves when Tkinter is missing, and a silently
      # skipped test is not a passing one. On the primary version that is a
      # build failure; on the oldest supported version it is only reported,
      # because Tkinter is not always bundled with older runner builds.
      - name: Check Tkinter is available
        run: |
          if python -c "import tkinter" 2>/dev/null; then
            echo "Tkinter present: GUI tests will run."
          elif [ "${{ matrix.python }}" = "3.12" ]; then
            echo "::error::Tkinter is missing on the primary Python; GUI tests would be skipped."
            exit 1
          else
            echo "::warning::Tkinter missing on ${{ matrix.python }}; GUI tests will be skipped."
          fi

      # xvfb gives the Tk windows a display so they run headlessly.
      - name: Run the test suite
        run: xvfb-run -a python -m unittest discover -s tests -v

      # A passing suite proves the code does what the tests say. This walks
      # the specification itself, item by item, against running code.
      - name: Verify every specification requirement
        run: python tools/verify_spec.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: pip install flake8

      # Errors only. Style opinions are not worth failing a build over, but an
      # undefined name or a syntax error on a path the tests miss is.
      - name: flake8 (errors only)
        run: flake8 bookstore tools tests run.py
             --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: flake8 (full report, advisory)
        run: flake8 bookstore tools tests run.py
             --count --exit-zero --max-complexity=15 --max-line-length=100
             --statistics

  api:
    name: API and web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries OpenCV links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed a demo shop
        run: python tools/seed.py --reset

      - name: HTTP contract tests
        run: python -m unittest tests.test_api -v

      # Starting the server for real catches what TestClient cannot: a bad
      # uvicorn entry point, a static mount that resolves differently on disk,
      # a port that never binds.
      - name: Boot the server and check it answers
        run: |
          python -m uvicorn bookstore.api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/app/ | grep -q "<title>"
          curl -fsS http://127.0.0.1:8000/app/app.js > /dev/null
          curl -fsS http://127.0.0.1:8000/openapi.json > /dev/null

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t smart-bookstore .

      - name: Run it and check the shop answers
        run: |
          docker run -d --name shop -p 8000:8000 smart-bookstore
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          docker rm -f shop
