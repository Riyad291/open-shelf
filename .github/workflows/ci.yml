name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: ci-only-secret-not-used-anywhere-real

jobs:
  # The suite twice, against both supported databases. They are not
  # interchangeable: PostgreSQL returns timezone-aware datetimes and SQLite
  # naive ones, and PostgreSQL has row-level locking where SQLite does not.
  # A bug that only appears on one of them has already happened here once.
  tests:
    name: Tests (${{ matrix.database }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            database: postgresql
          - python: "3.12"
            database: sqlite
          - python: "3.11"
            database: postgresql

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the libraries OpenCV links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run the suite
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://postgres:postgres@localhost:5432/bookstore_test' || '' }}
        run: pytest tests/ -v

      # The concurrent-import test skips where writers cannot run at once. On
      # PostgreSQL it must actually run: a skipped test is not a passing one.
      # (An earlier version of this check used `grep -qv skipped`, which
      # succeeds whenever any line lacks the word -- so it could never fail.)
      - name: Concurrency test must not have been skipped
        if: matrix.database == 'postgresql'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bookstore_test
        run: |
          output=$(pytest tests/test_ingest_pipeline.py::TestConcurrentImports -q -rs 2>&1)
          echo "$output"
          if echo "$output" | grep -q "skipped"; then
            echo "::error::The concurrency test skipped on PostgreSQL."
            exit 1
          fi

  conformance:
    name: Acceptance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the libraries OpenCV links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # A passing suite proves the code does what the tests say. This proves
      # the tests say what the feature list says: it drives the real API and
      # prints the evidence beside each of the ten required features.
      - name: Every feature, end to end
        run: python tools/verify_features.py

      # A quality gate, not a test: retrieval routing, tiering and picture
      # search measured on labelled questions, failing below a threshold.
      - name: AI evaluation
        run: python tools/evaluate_ai.py

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookstore_mig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bookstore_mig

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the libraries OpenCV links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply every migration to an empty database
        run: alembic upgrade head

      # The guard that matters: if somebody changes a model and forgets the
      # migration, the schema and the code drift apart silently until a
      # deployment fails. This fails the build instead.
      - name: The migrations must match the models
        run: |
          output=$(alembic check 2>&1)
          echo "$output"
          echo "$output" | grep -q "No new upgrade operations detected" || {
            echo "::error::A model changed without a migration. Run: alembic revision --autogenerate -m '<what changed>'"
            exit 1
          }

      - name: Downgrade must work too
        run: |
          alembic downgrade base
          alembic upgrade head

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install flake8

      # Errors only. Style opinions are not worth failing a build over; an
      # undefined name on a path the tests miss is.
      - name: flake8 (errors)
        run: flake8 bookstore tools tests
             --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: flake8 (full report, advisory)
        run: flake8 bookstore tools tests
             --count --exit-zero --max-complexity=15 --max-line-length=100
             --statistics

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the whole stack
        run: docker compose up --build -d

      # Health reports whether the service can read its own data, so this is
      # a real check rather than "did the port open".
      - name: Wait for the shop to be ready
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health 2>/dev/null \
               | grep -q '"database":"ok"'; then
              echo "ready after ${attempt}s"
              curl -fsS http://localhost:8000/api/health
              exit 0
            fi
            sleep 2
          done
          echo "::error::The stack did not become healthy."
          docker compose logs
          exit 1

      - name: The shop has stock and the client is served
        run: |
          curl -fsS http://localhost:8000/api/books | head -c 200
          curl -fsS http://localhost:8000/app/ | grep -q "<title>"
          curl -fsS http://localhost:8000/openapi.json > /dev/null

      - name: Stop
        if: always()
        run: docker compose down -v
