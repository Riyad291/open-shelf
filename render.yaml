# Deployment, as a file rather than as clicks in a dashboard.
#
# Render reads this on "New > Blueprint" and creates everything in it. The
# point of checking it in is that the deployment is reviewable and
# repeatable: what is running is whatever this file says, and a change to
# it goes through the same pull request as a change to the code.
#
# The database is NOT here on purpose. Render's own free PostgreSQL expires
# after 30 days; Neon's free tier does not, so the database is created there
# and its connection string is pasted in as a secret. A secret in a
# committed file would be a secret no longer.

services:
  - type: web
    name: open-shelf
    runtime: docker
    plan: free
    # Same region as the Neon database (us-east-1). A web request that
    # crosses the country to reach its database pays for it on every query.
    region: virginia
    healthCheckPath: /api/health

    envVars:
      # Set once in the dashboard, never committed.
      #   DATABASE_URL  postgresql+psycopg://...   (from Neon)
      #   JWT_SECRET    generated below
      #   LLM_API_KEY   optional; without it the assistant still answers
      #                 from the local help files
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false

      # Generated by Render and kept across deploys. Signing tokens with a
      # value that changed on every deploy would sign everyone out.
      - key: JWT_SECRET
        generateValue: true

      # The browser client is served by this same service, from the same
      # origin, so no cross-origin request needs allowing. "*" is the
      # development default and would be wrong here.
      - key: CORS_ORIGINS
        value: https://open-shelf-1qsl.onrender.com

      - key: PYTHONUNBUFFERED
        value: "1"
